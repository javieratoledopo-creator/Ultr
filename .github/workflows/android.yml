name: Build Android TV APK

on:
  workflow_dispatch:      # te deja correrlo a mano desde la pestaña Actions
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la web app (Vite)
        run: npm run build

      - name: Instalar Capacitor CLI
        run: npm install @capacitor/core @capacitor/android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (release, sin firmar)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Firmar el APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: UltraTV-apk
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
