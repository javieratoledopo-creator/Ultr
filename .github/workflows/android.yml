name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/ultra-tv   # ruta dentro del zip descomprimido

    steps:
      - name: Checkout cÃ³digo
        uses: actions/checkout@v4

      - name: Descomprimir cÃ³digo fuente
        working-directory: .
        run: |
          if [ -f "UltraTV-SourceCode.zip" ]; then
            unzip -o UltraTV-SourceCode.zip -d .
          else
            echo "No se encontrÃ³ UltraTV-SourceCode.zip en la raÃ­z del repo"
            exit 1
          fi
          echo "--- Contenido descomprimido ---"
          find artifacts/ultra-tv -maxdepth 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Agregar Capacitor al proyecto
        run: |
          npm pkg set dependencies.@capacitor/core="^6.2.0"
          npm pkg set dependencies.@capacitor/android="^6.2.0"
          npm pkg set devDependencies.@capacitor/cli="^6.2.0"

      - name: Eliminar capacitor.config.ts si existe (bug de parsing en @capacitor/cli)
        run: rm -f capacitor.config.ts

      - name: Crear capacitor.config.json (si no existe)
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ultratv.app",
            "appName": "UltraTV",
            "webDir": "dist",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          EOF
          fi

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la web app (Vite)
        run: npm run build

      - name: Agregar plataforma Android (primera vez)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generar banner de Android TV
        run: |
          mkdir -p android/app/src/main/res/drawable
          echo "" | base64 -d > android/app/src/main/res/drawable/tv_banner.png
          ls -la android/app/src/main/res/drawable/tv_banner.png

      - name: Configurar manifest para Android TV (Leanback launcher)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.software.leanback" "$MANIFEST"; then
            sed -i 's#<application#<uses-feature android:name="android.software.leanback" android:required="true" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n\n    <application#' "$MANIFEST"
          fi

          if ! grep -q "android:banner" "$MANIFEST"; then
            sed -i 's#<application#<application\n        android:banner="@drawable/tv_banner"#' "$MANIFEST"
          fi

          if ! grep -q "LEANBACK_LAUNCHER" "$MANIFEST"; then
            sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />#' "$MANIFEST"
          fi

          sed -i 's#android:name="\.MainActivity"#android:name=".MainActivity"\n            android:screenOrientation="landscape"#' "$MANIFEST"

          cat "$MANIFEST"

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (release, sin firmar)
        working-directory: artifacts/ultra-tv/android
        run: ./gradlew assembleRelease

      - name: Instalar Android build-tools para firma
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" || true
          ls ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/ || true

      - name: Firmar el APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: artifacts/ultra-tv/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: UltraTV-apk
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
