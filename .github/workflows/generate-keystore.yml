name: Generar Keystore de Firma

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Alias de la key (elegÃ­ un nombre simple, ej: ultratv)'
        required: true
        default: 'ultratv'
      password:
        description: 'ContraseÃ±a del keystore y de la key (anotala, la vas a necesitar)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar keystore con keytool
        run: |
          keytool -genkey -v \
            -keystore ultratv.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=UltraTV, OU=Personal, O=UltraTV, L=CABA, ST=BA, C=AR"

      - name: Convertir a base64
        run: base64 -w0 ultratv.keystore > ultratv.keystore.base64.txt

      - name: Subir keystore y base64 como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: keystore-ultratv
          path: |
            ultratv.keystore
            ultratv.keystore.base64.txt
          retention-days: 7
